<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- ダイナミック・オーロラグラデーション背景 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041d14" />
      <stop offset="50%" stop-color="#083a27" />
      <stop offset="100%" stop-color="#010d08" />
    </linearGradient>

    <!-- テーマ別アクセントグラデーション -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- ゴールドスターグラデーション -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- オーロラグロー効果 -->
    <radialGradient id="glowTop" cx="80%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="glowBottom" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- クロップ用シャドウフィルタ -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowTop)" />
  <rect width="1200" height="630" fill="url(#glowBottom)" />

  <!-- 外枠ネオンストローク（高級感・ブランドフレーム） -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- ハイテク背景グリッド -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- ヘッダー行: ブランドバッジ ＆ カテゴリ -->
  <g transform="translate(60, 55)">
    <rect width="360" height="42" rx="21" fill="rgba(5, 150, 105, 0.25)" stroke="#10b981" stroke-width="1.4" />
    <text x="180" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.2">
      ⚡ AUTO TECH RADAR ｜ DEV TOOLS / CLI
    </text>
  </g>

  <!-- ヘッダー右: ゴールドスターメガバッジ -->
  <g transform="translate(930, 55)">
    <rect width="210" height="42" rx="21" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.4" />
    <text x="105" y="27" fill="#fbbf24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="18" font-weight="900" text-anchor="middle">★ 5,203</text>
  </g>

  <!-- 巨大テックモノグラム・3Dシンボルブロック（視覚的アイキャッチ） -->
  <g transform="translate(60, 140)">
    <rect width="110" height="110" rx="22" fill="#0d1117" stroke="#34d399" stroke-width="2.5" filter="url(#cardShadow)" />
    <text x="55" y="58" font-size="40" text-anchor="middle" dominant-baseline="central">🛠️</text>
    <text x="55" y="94" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" text-anchor="middle">ME</text>
  </g>

  <!-- メインタイトル（リポジトリ名） -->
  <g transform="translate(195, 175)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-0.5">
      mediawiki
    </text>
    <text x="0" y="44" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800">
      海外急上昇OSS 徹底解剖 ＆ 商用手順書
    </text>
  </g>

  <!-- 【超高視認性】キラー帯（実績者が絶対に使う注目座布団バナー） -->
  <g transform="translate(60, 285)">
    <rect width="1080" height="64" rx="10" fill="rgba(5, 150, 105, 0.25)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="64" rx="4" fill="#34d399" />
    <text x="30" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">
      💰 想定受託単価: <tspan fill="#34d399">¥80万〜¥200万</tspan> ｜ <tspan fill="#e2e8f0" font-weight="600">開発者生産性爆上げ・業務自動化ツール</tspan>
    </text>
  </g>

  <!-- リポジトリ概要（抜粋） -->
  <g transform="translate(60, 395)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
      🌻 The collaborative editing software that runs Wikipedia. Mirror fr...
    </text>
  </g>

  <!-- フッター実績プルーフバッジ群 -->
  <g transform="translate(60, 480)">
    <!-- バッジ 1: 商用SaaS活用手順 -->
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.2" />
    <text x="130" y="31" fill="#34d399" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">✓ 商用SaaS化・構築手順付</text>

    <!-- バッジ 2: 社内稟議テンプレ -->
    <rect x="280" y="0" width="260" height="50" rx="10" fill="#0d1117" stroke="#3b82f6" stroke-width="1.2" />
    <text x="410" y="31" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">✓ 社内稟議・提案書ドラフト</text>

    <!-- バッジ 3: 技術タグ -->
    <rect x="560" y="0" width="280" height="50" rx="10" fill="#0d1117" stroke="#374151" stroke-width="1.2" />
    <text x="700" y="31" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="middle">PHP ｜ OSS ｜ GitHub</text>

    <!-- バッジ 4: PRO限定 -->
    <rect x="860" y="0" width="220" height="50" rx="10" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="970" y="31" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">🔒 完全保存版 PRO</text>
  </g>
</svg>