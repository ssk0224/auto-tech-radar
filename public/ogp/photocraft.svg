<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 多層ディープグラデーション背景 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a04" />
      <stop offset="50%" stop-color="#4a1506" />
      <stop offset="100%" stop-color="#100301" />
    </linearGradient>

    <!-- 主役アクセントグラデーション -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- ゴールドスターグラデーション -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- 特注オーロラグロー効果（記事ごとに照射角度・位置が変動） -->
    <radialGradient id="glowDynamic" cx="83%" cy="29%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- ドロップシャドウ -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowDynamic)" />

  <!-- 記事個別ジェネレーティブ・ハイテク背景パターン -->
  
        <g opacity="0.15" stroke="#fb923c" fill="none">
          <circle cx="1050" cy="220" r="100" stroke-width="1.2" />
          <circle cx="1050" cy="220" r="220" stroke-width="1" stroke-dasharray="10 8" />
          <circle cx="1050" cy="220" r="360" stroke-width="1" opacity="0.6" />
          <line x1="1050" y1="0" x2="1050" y2="630" stroke-width="1" opacity="0.4" />
          <line x1="600" y1="220" x2="1200" y2="220" stroke-width="1" opacity="0.4" />
        </g>
      

  <!-- 外枠プレミアムフレーム（ネオンデュアルライン） -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="25" y="25" width="1150" height="580" rx="13" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.08" />

  <!-- ヘッダー行: ブランドバッジ ＆ カテゴリ -->
  <g transform="translate(60, 52)">
    <rect width="380" height="44" rx="22" fill="rgba(249, 115, 22, 0.2)" stroke="#fb923c" stroke-width="1.4" />
    <text x="190" y="28" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="1.2">
      ⚡ AUTO TECH RADAR ｜ ULTRA HIGH-SPEED RUST
    </text>
  </g>

  <!-- ヘッダー右: ゴールドスターメガバッジ -->
  <g transform="translate(930, 52)">
    <rect width="210" height="44" rx="22" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="105" y="28" fill="#fbbf24" font-family="'JetBrains Mono', 'Segoe UI', monospace, sans-serif" font-size="19" font-weight="900" text-anchor="middle">★ 35,313</text>
  </g>

  <!-- 巨大3Dモノグラム＆シンボル（左アイキャッチブロック） -->
  <g transform="translate(60, 135)">
    <rect width="115" height="115" rx="24" fill="#0d1117" stroke="#fb923c" stroke-width="2.6" filter="url(#cardShadow)" />
    <text x="57" y="60" font-size="44" text-anchor="middle" dominant-baseline="central">🔥</text>
    <text x="57" y="98" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" text-anchor="middle">PH</text>
  </g>

  <!-- メインタイトル ＆ サブヘッド -->
  <g transform="translate(205, 172)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="64" font-weight="900" letter-spacing="-0.5">
      photocraft
    </text>
    <text x="0" y="45" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="25" font-weight="800">
      海外急上昇OSS 徹底解剖 ＆ 商用手順書
    </text>
  </g>

  <!-- 【超高視認性】キラー帯（想定受託単価 ＆ 収益化モデル） -->
  <g transform="translate(60, 282)">
    <rect width="1080" height="66" rx="12" fill="rgba(249, 115, 22, 0.2)" stroke="#fb923c" stroke-width="1.6" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="10" height="66" rx="5" fill="#fb923c" />
    <text x="32" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="22" font-weight="900">
      💰 想定受託単価: <tspan fill="#fb923c">¥140万〜¥300万</tspan> ｜ <tspan fill="#f1f5f9" font-weight="700">超高速ネイティブエンジン・高負荷バックエンド刷新</tspan>
    </text>
  </g>

  <!-- リポジトリ概要（抜粋） -->
  <g transform="translate(60, 395)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="22" font-weight="500">
      An open-source, clean-room reimplementation of Adobe Photoshop in pure R...
    </text>
  </g>

  <!-- フッター実績プルーフバッジ群（4大キラープルーフ） -->
  <g transform="translate(60, 480)">
    <!-- バッジ 1: 商用SaaS活用手順 -->
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#0d1117" stroke="#fb923c" stroke-width="1.3" />
    <text x="130" y="31" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Meiryo', sans-serif" font-size="16" font-weight="800" text-anchor="middle">✓ 商用SaaS化・構築手順付</text>

    <!-- バッジ 2: 社内稟議テンプレ -->
    <rect x="280" y="0" width="260" height="50" rx="10" fill="#0d1117" stroke="#3b82f6" stroke-width="1.3" />
    <text x="410" y="31" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Meiryo', sans-serif" font-size="16" font-weight="800" text-anchor="middle">✓ 社内稟議・提案書ドラフト</text>

    <!-- バッジ 3: 技術タグ -->
    <rect x="560" y="0" width="280" height="50" rx="10" fill="#0d1117" stroke="#374151" stroke-width="1.3" />
    <text x="700" y="31" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="middle">Rust ｜ OSS ｜ GitHub</text>

    <!-- バッジ 4: PRO限定 -->
    <rect x="860" y="0" width="220" height="50" rx="10" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.3" />
    <text x="970" y="31" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Meiryo', sans-serif" font-size="16" font-weight="800" text-anchor="middle">🔒 完全保存版 PRO</text>
  </g>
</svg>