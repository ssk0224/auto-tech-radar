<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="950" cy="150" r="350" fill="url(#accent)" />
  <circle cx="150" cy="500" r="280" fill="url(#accent)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Header Badge -->
  <g transform="translate(100, 90)">
    <rect width="320" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="160" y="27" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ GLOBAL OSS INTELLIGENCE</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="220" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Auto Tech Radar
  </text>
  <text x="100" y="295" fill="url(#brand)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">
    海外急上昇OSS日本語解剖 ＆ 収益化メディア
  </text>

  <!-- Subtitle / Value Prop -->
  <text x="100" y="375" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
    毎朝6:00 JST自動更新 ｜ アーキテクチャ深層解説 ｜ 受託・自社SaaS構築マネタイズ手順書
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(100, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <text x="110" y="33" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">GitHub Trending直結</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="52" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <text x="350" y="33" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Stripe即時買い切り(¥980)</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="52" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <text x="590" y="33" fill="#a855f7" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">note メンバーシップ</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="260" height="52" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <text x="850" y="33" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">B2B協賛・受託(¥100k〜)</text>
  </g>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#1f2937" stroke-width="2" />
</svg>
