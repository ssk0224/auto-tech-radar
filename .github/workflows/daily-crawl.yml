name: Daily Tech Radar Pipeline

on:
  schedule:
    - cron: "17 21 * * *" # 第1便: 日本時間 毎朝6時17分 (0分集中によるGitHubキュー遅延を回避)
    - cron: "43 23 * * *" # 第2便: 日本時間 毎朝8時43分 (遅延・スキップ救済用フェイルセーフバックアップ)
    - cron: "17 3 * * *"  # 第3便: 日本時間 昼12時17分 (日中保証フェイルセーフ)
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - name: Install Japanese CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Crawler & Gemini
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl_and_generate.mjs

      - name: Build Astro SSG
        run: npm run build

      - name: Notify Search Engines (IndexNow)
        run: node scripts/ping_search_engines.mjs

      - name: Auto Tweet to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/auto_tweet_x.mjs

      - name: Commit and push changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "ssk0224"
          git config --global user.email "ssk0224@users.noreply.github.com"
          git add src/pages/radar/ note_drafts/ x_posts/ zenn_drafts/ articles/ public/
          if git diff --staged --quiet; then
            echo "No new radar entries."
          else
            git commit -m "chore: auto-index new tech radar entry [skip ci]"
            git pull --rebase origin main || true
            if [ -n "$GH_PAT" ]; then
              git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" main
            else
              git push origin main
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
