name: Daily Tech Radar Pipeline

on:
  schedule:
    - cron: "17 21 * * *" # 第1便: 日本時間 毎朝6時17分 (0分集中によるGitHubキュー遅延を回避)
    - cron: "43 23 * * *" # 第2便: 日本時間 毎朝8時43分 (遅延・スキップ救済用フェイルセーフバックアップ)
    - cron: "17 3 * * *"  # 第3便: 日本時間 昼12時17分 (日中保証フェイルセーフ)
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      # コミットする人の名前と、publish_history.json などのマージドライバ（.gitattributes）を、どの git pull よりも前に設定する。
      # （以前はコミットする変更がある回だけ設定していたため、X 投稿の記録を push する git pull --rebase がドライバ無しで衝突することがあった）
      - name: Configure git
        run: |
          git config --global user.name "ssk0224"
          git config --global user.email "ssk0224@users.noreply.github.com"
          node scripts/utils/git_sync.mjs configure
      # 再実行（Re-run）・キューで待った定期便は、起動した時点の古い commit を checkout する。その古い作業ツリーで
      # 「今日の記録は済んだか」を決めて data/ を書くと、push の段階で main の記録と衝突し、デプロイごと止まる。最新の main に進めてから始める
      - name: Fast-forward to latest main
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      # 品質ゲートが不具合を本当に止めるかの検証を含むテスト（失敗したら生成・公開しない）
      - run: npm test
      - name: Install Japanese CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # Radar Ledger: 候補・掲載済みリポジトリの公開指標を UTC 日付ごとに 1 回記録する（data/ledger/、data/derived/velocity.json）。
      # 過去の日の値は後から取り直せないため生成より先に行う。スクリプト自体が通信失敗でも終了コード 0 で終わる（デプロイを止めない）
      - name: Snapshot ledger
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/snapshot_ledger.mjs

      - name: Run Crawler & Gemini
        id: crawler
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        # 通信が止まったままでも、後続の便を何時間も待たせずに既存の記事で公開を続ける
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # note の有料部分の作り方（節の構成と分量）。公開リポジトリに置かない（leakhunt #51）。無ければ Web 記事と X だけを作る
          NOTE_PAID_RECIPE: ${{ secrets.NOTE_PAID_RECIPE }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # 実行結果の記録（data/run_status/）にどの便かを残す
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/crawl_and_generate.mjs

      - name: Verify Crawler Outcome
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.crawler.outcome == 'failure'
        run: |
          echo "::warning title=Crawler Warning::Crawler encountered an issue (API rate limit or temporary upstream outage). Pipeline will proceed to build and deploy existing content safely."

      # 記事ごとの note 有料版 URL を取得（失敗しても前回の対応表で続行）。
      # 公開中の note の検査結果はコミットしない（$RUNNER_TEMP に書き、問題は ::error で知らせる。公開リポに「要修正の記事の一覧」を置かない）
      - name: Sync note article URLs
        continue-on-error: true
        timeout-minutes: 20
        env:
          ATR_NOTE_STATUS: ${{ runner.temp }}/note_status.json
        run: node scripts/sync_note_urls.mjs

      # 新規生成物も含めた品質テスト（禁止表現・暗号化境界・送客リンク整合性）
      # 不合格なら、まず note / Zenn の同期結果（この回に取り直した対応表）を前回のものに戻して確かめ、
      # それでも不合格なら、この回に生成した記事も取り除いて既存の記事で公開を続ける（1本の不備・同期の食い違いでサイト更新・X 投稿まで止めない）。
      # どちらの場合も最後の「Fail if generated content was rejected」でこの実行を失敗にして気づけるようにする。
      # ここで戻す・取り除くファイルは、この実行が commit するもの（data/ の実行記録を除く）をすべて含む（tests/workflow.test.mjs が確かめる）
      - name: Post-Crawl Quality Test Gate
        id: gate
        env:
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if npm test; then
            exit 0
          fi
          # note の公開状況の変化（非公開にした・タイトルを変えた記事）で対応表が変わり、テストに通らなくなることがある
          git checkout -- scripts/note_urls.json
          if npm test; then
            echo "::error title=note sync rejected::note の同期結果がテストに通らなかったため、前回の対応表のまま公開します（公開中の note と原稿の対応を確認してください）"
            echo "sync_rejected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=Generated content rejected::生成した記事がテストに通らなかったため、この回の生成物を取り除いて既存の記事で公開します"
          echo "rejected=true" >> "$GITHUB_OUTPUT"
          # 実行結果の記録（data/run_status）に、生成した記事を取り除いたことを残す（アラートに「ok」だけが載らないように）
          if [ "${{ github.event_name }}" != "push" ]; then node scripts/utils/run_status.mjs rejected || true; fi
          git checkout -- src/pages/radar note_drafts public/ogp
          git clean -fdq -- src/pages/radar note_drafts public/ogp
          npm test

      - name: Build Astro SSG
        run: npm run build

      - name: Commit and push changes
        run: |
          # 足すのは公開出力の台帳（scripts/utils/public_tree.mjs）で CI が書く出力だけ（tests/public_tree.test.mjs が確かめる）。
          # data/ の実行記録 run_status・日次スナップショット ledger・velocity はサイトのビルド対象外だが公開する記録
          git add src/pages/radar/ note_drafts/ public/ogp/ data/run_status/ data/ledger/ data/derived/ scripts/note_urls.json
          if git diff --staged --quiet; then
            echo "No new radar entries to commit."
          else
            git commit -m "chore: auto-index new tech radar entry [skip ci]"

            # 認証は actions/checkout が token（GH_PAT または GITHUB_TOKEN）で設定済み。
            # 別途 extraheader を足すと認証ヘッダーが二重になり push が拒否されるため設定しない
            # publish_history.json などのマージドライバは最初の「Configure git」で設定済み（.gitattributes 参照）

            # 最新の main に載せ直して push（最大3回）。衝突は自動で握りつぶさず失敗として扱う
            PUSH_SUCCESS=false
            for i in 1 2 3; do
              echo "Git pull/rebase and push attempt $i of 3..."
              if git pull --rebase origin main; then
                # 取り込んだ変更と合わせても品質ゲート（有料部分の暗号化・鍵の一致など）を満たすか確認
                node scripts/audit_quality.mjs
                if git push origin main; then
                  echo "Successfully pushed changes to main."
                  PUSH_SUCCESS=true
                  break
                fi
              else
                echo "::warning::Rebase failed (conflict or network). Aborting and retrying."
                git rebase --abort || true
              fi
              sleep 5
            done

            if [ "$PUSH_SUCCESS" != "true" ]; then
              echo "::error::Failed to push changes to main after 3 attempts."
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Fresh Site for Deployment
        run: |
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5

        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 新しい記事が出るのは定期実行だけ。コード修正の push ごとに同じ URL を再送しない
      - name: Notify Search Engines (IndexNow)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.deployment.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/ping_search_engines.mjs

      - name: Fail if generated content was rejected
        if: steps.gate.outputs.rejected == 'true' || steps.gate.outputs.sync_rejected == 'true'
        run: |
          if [ "${{ steps.gate.outputs.rejected }}" = "true" ]; then
            echo "::error::この回に生成した記事はテスト不合格のため公開していません。上の Post-Crawl Quality Test Gate のログを確認してください"
          else
            echo "::error::note の同期結果はテスト不合格のため反映していません（記事の公開は続けています）。上の Post-Crawl Quality Test Gate のログを確認してください"
          fi
          exit 1
