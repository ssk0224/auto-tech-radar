name: Daily Tech Radar Pipeline

on:
  schedule:
    - cron: "17 21 * * *" # 第1便: 日本時間 毎朝6時17分 (0分集中によるGitHubキュー遅延を回避)
    - cron: "43 23 * * *" # 第2便: 日本時間 毎朝8時43分 (遅延・スキップ救済用フェイルセーフバックアップ)
    - cron: "17 3 * * *"  # 第3便: 日本時間 昼12時17分 (日中保証フェイルセーフ)
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      alert_check:
        description: "最後に「本日の記事が無ければ Issue でアラート」の確認も行う"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # 記事が出なかった日のアラート（scripts/alert_if_no_article.mjs）

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      # 品質ゲートが不具合を本当に止めるかの検証を含むテスト（失敗したら生成・公開しない）
      - run: npm test
      - name: Install Japanese CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Crawler & Gemini
        id: crawler
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # 実行結果の記録（data/run_status/）にどの便かを残す
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/crawl_and_generate.mjs

      - name: Verify Crawler Outcome
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.crawler.outcome == 'failure'
        run: |
          echo "::warning title=Crawler Warning::Crawler encountered an issue (API rate limit or temporary upstream outage). Pipeline will proceed to build and deploy existing content safely."

      # 記事ごとの note 有料版 URL を取得（失敗しても前回の対応表で続行）
      - name: Sync note article URLs
        continue-on-error: true
        run: |
          node scripts/sync_note_urls.mjs
          node scripts/check_zenn.mjs || true

      # 新規生成物も含めた品質テスト（禁止表現・暗号化境界・送客リンク整合性）
      # 不合格なら、この回に生成した記事だけを取り除いて既存の記事で公開を続ける（1本の不備でサイト更新・X 投稿まで止めない）。
      # 取り除いた場合は最後の「Fail if generated content was rejected」でこの実行を失敗にして気づけるようにする
      - name: Post-Crawl Quality Test Gate
        id: gate
        run: |
          if npm test; then
            exit 0
          fi
          echo "::error title=Generated content rejected::生成した記事がテストに通らなかったため、この回の生成物を取り除いて既存の記事で公開します"
          echo "rejected=true" >> "$GITHUB_OUTPUT"
          git checkout -- src/pages/radar note_drafts x_posts zenn_drafts articles public scripts/publish_history.json
          git clean -fdq -- src/pages/radar note_drafts x_posts zenn_drafts articles public
          npm test

      - name: Build Astro SSG
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name "ssk0224"
          git config --global user.email "ssk0224@users.noreply.github.com"
          # data/（実行結果の記録 run_status・日次スナップショット ledger）はサイトのビルド対象外。まだ無い回でも git add が失敗しないように作っておく
          mkdir -p data
          git add src/pages/radar/ note_drafts/ x_posts/ zenn_drafts/ articles/ public/ data/ scripts/publish_history.json scripts/note_urls.json scripts/note_status.json scripts/zenn_status.json
          if git diff --staged --quiet; then
            echo "No new radar entries to commit."
          else
            git commit -m "chore: auto-index new tech radar entry [skip ci]"

            # 認証は actions/checkout が token（GH_PAT または GITHUB_TOKEN）で設定済み。
            # 別途 extraheader を足すと認証ヘッダーが二重になり push が拒否されるため設定しない

            # publish_history.json および note_urls.json は和集合でマージする（.gitattributes 参照）
            git config merge.publish-history.driver "node scripts/merge_publish_history.mjs %O %A %B"
            git config merge.note-urls.driver "node scripts/merge_note_urls.mjs %O %A %B"
            git config merge.note-status.driver "node scripts/merge_note_status.mjs %O %A %B"

            # 最新の main に載せ直して push（最大3回）。衝突は自動で握りつぶさず失敗として扱う
            PUSH_SUCCESS=false
            for i in 1 2 3; do
              echo "Git pull/rebase and push attempt $i of 3..."
              if git pull --rebase origin main; then
                # 取り込んだ変更と合わせても品質ゲート（有料部分の暗号化・鍵の一致など）を満たすか確認
                node scripts/audit_quality.mjs
                if git push origin main; then
                  echo "Successfully pushed changes to main."
                  PUSH_SUCCESS=true
                  break
                fi
              else
                echo "::warning::Rebase failed (conflict or network). Aborting and retrying."
                git rebase --abort || true
              fi
              sleep 5
            done

            if [ "$PUSH_SUCCESS" != "true" ]; then
              echo "::error::Failed to push changes to main after 3 attempts."
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Fresh Site for Deployment
        run: |
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5

        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # デプロイ成功後のみ X へ投稿（未デプロイ記事の404リンク投稿を根本遮断）
      - name: Auto Tweet to X
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          node scripts/auto_tweet_x.mjs
          if git diff --quiet scripts/publish_history.json; then
            echo "No publish history update."
          else
            git add scripts/publish_history.json
            git commit -m "chore: record published tweet history [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      # 新しい記事が出るのは定期実行だけ。コード修正の push ごとに同じ URL を再送しない
      - name: Notify Search Engines (IndexNow)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.deployment.outcome == 'success'
        continue-on-error: true
        run: node scripts/ping_search_engines.mjs

      - name: Fail if generated content was rejected
        if: steps.gate.outputs.rejected == 'true'
        run: |
          echo "::error::この回に生成した記事はテスト不合格のため公開していません。上の Post-Crawl Quality Test Gate のログを確認してください"
          exit 1

      # 第3便（12:17 JST）の最後に、日本時間の今日の記事が 1 本も無ければ Issue（ラベル pipeline-alert）でアラートする。
      # 途中のステップが失敗していても確認する（!cancelled()）。手動実行では alert_check にチェックを入れたときだけ
      - name: Alert if no article today
        if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.alert_check)) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/alert_if_no_article.mjs
