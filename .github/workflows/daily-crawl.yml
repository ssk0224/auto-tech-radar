name: Daily Tech Radar Pipeline

on:
  schedule:
    - cron: "0 21 * * *" # 日本時間 毎朝6時
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - name: Run Crawler & Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/crawl_and_generate.mjs

      - name: Build Astro SSG
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/radar/
          if git diff --staged --quiet; then
            echo "No new radar entries."
          else
            git commit -m "chore: auto-index new tech radar entry"
            git push
          fi
