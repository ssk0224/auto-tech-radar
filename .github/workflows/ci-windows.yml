name: Windows tests

# owner PC（Windows 11・core.autocrlf=true・symlink の権限なし）と同じ条件で全テストを走らせる。
# 本番の定期実行（daily-crawl.yml）は Linux なので、それだけでは「Windows でだけ落ちる」不具合が見えず、owner PC の赤が「環境のノイズ」として放置された。
# この workflow が赤なら、Windows で壊れているということ（公開・生成は止めない。気づくためのもの）。tests/env_portability.test.mjs がこの手順の崩れを検査する。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    # 作業ツリーの改行を 2 通り回す。lf: owner PC の実際の状態（.gitattributes の eol=lf で checkout は LF。os.EOL で split するコードはここで落ちる）。
    # crlf: エディタの保存・古い checkout で CRLF になったファイル（\n だけを前提に読むコードはここで落ちる）
    strategy:
      fail-fast: false
      matrix:
        eol: [lf, crlf]
    steps:
      # owner PC と同じ git 設定にしてから checkout する（この設定は checkout より前でないと効かない）
      - name: Match the owner PC git settings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      # Node・ロケール・時間帯も owner PC に合わせる（tests/helpers/owner_host.json。runner の既定は en-US・UTC で、日付の表記・日付の境目が owner PC と違う）。
      # 合わせられたかは、テストの中で実際の値を確かめる（ATR_OWNER_MIRROR=1。tests/env_portability.test.mjs）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Match the owner PC locale and time zone
        shell: pwsh
        run: |
          Set-Culture ja-JP
          tzutil /s "Tokyo Standard Time"
      - run: npm ci
      # 追跡しているテキストを全部 matrix.eol にそろえる（どちらで走ったかは、テストの中で実際の作業ツリーで確かめる。ATR_WORKTREE_EOL）
      - name: Align the working tree line endings
        run: node tests/helpers/worktree_eol.mjs ${{ matrix.eol }}
      # 鍵が無いので有料本文の検査（復号）は skip になる。Chrome が見つからないことなど、許可していない理由の skip は失敗にする（緑のまま何も検証しない事故を防ぐ。tests/helpers/skip_gate_reporter.mjs）
      # runner は管理者で、権限の要る symlink を作れる（owner PC は作れない）。同じシェルの中でその権限を外してから npm test を起動する（子孫はこのトークンを受け継ぐ）
      - name: Run all tests
        shell: pwsh
        env:
          ATR_REQUIRE_CHROME: "1"
          ATR_FORBID_SKIP: "1"
          ATR_OWNER_MIRROR: "1"
          ATR_WORKTREE_EOL: ${{ matrix.eol }}
          TZ: Asia/Tokyo
        run: |
          . ./tests/helpers/drop_symlink_privilege.ps1
          npm test
